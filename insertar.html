<!DOCTYPE html>
<html>

     <main class = "px-4 d-flex align-items-center flex-column">

         <h3> Insertar Empleado</h3>
         <form id="form" class="my-2 mx-5 mb-5 d-flex flex-column w-25">
            <label class="form-label text-start" for="nombre">Nombre:</label>
            <input class="form-control mb-3" name="nombre" type = "text" id placeholder = "Maria">
            <label class="form-label" for = "salario">Salario:</label>
            <input class="form-control mb-3" name="salario" type = "text" placeholder = "100000.00">
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-success w-25"> Insertar</button>
            </div>
         </form>
     </main>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
